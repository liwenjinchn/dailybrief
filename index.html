<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="每天一篇重磅研究，读完即出系统性分析">
  <title>dailybrief · 每日重磅研究</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="site-header">
      <a href="#/" class="brand">
        <span class="brand-mark">d</span>
        <span class="brand-text">dailybrief</span>
      </a>
      <nav class="main-nav">
        <a href="#/" data-route="home" class="nav-link">今日</a>
        <a href="#/archive" data-route="archive" class="nav-link">归档</a>
        <a href="#/settings" data-route="settings" class="nav-link">设置</a>
      </nav>
    </header>

    <main id="view" class="view"></main>

    <footer class="site-footer">
      <p>每天一篇重磅研究 · 读完即出系统性分析</p>
    </footer>
  </div>

  <template id="tpl-home">
    <div class="home">
      <section class="hero">
        <span class="hero-label">今日推荐</span>
        <h1 class="hero-title" data-field="title"></h1>
        <p class="hero-summary" data-field="summary"></p>
        <div class="hero-meta">
          <span data-field="author"></span>
          <span class="meta-dot">·</span>
          <span data-field="source"></span>
          <span class="meta-dot">·</span>
          <time data-field="date"></time>
        </div>
        <div class="hero-actions">
          <a class="btn btn-primary" data-action="read">开始阅读</a>
          <div class="tags" data-field="tags"></div>
        </div>
      </section>

      <section class="recent">
        <h2 class="section-title">近期文章</h2>
        <div class="article-grid" data-field="recent-list"></div>
      </section>
    </div>
  </template>

  <template id="tpl-article">
    <article class="article-detail">
      <header class="article-head">
        <a href="#/" class="back-link">← 返回</a>
        <h1 class="article-title" data-field="title"></h1>
        <p class="article-otitle" data-field="otitle"></p>
        <div class="article-meta">
          <span data-field="author"></span>
          <span class="meta-dot">·</span>
          <span data-field="source"></span>
          <span class="meta-dot">·</span>
          <time data-field="date"></time>
        </div>
        <div class="tags" data-field="tags"></div>
      </header>

      <section class="article-summary">
        <h2>摘要</h2>
        <p data-field="summary"></p>
      </section>

      <section class="article-link">
        <a class="btn btn-ghost" data-field="url-link" target="_blank" rel="noopener">阅读原文 ↗</a>
      </section>

      <section class="analysis">
        <div class="analysis-header">
          <h2>AI 系统分析</h2>
          <button class="btn btn-primary" id="gen-analysis">生成分析</button>
        </div>
        <div class="analysis-body" id="analysis-body">
          <p class="analysis-empty">配置 API key 后点击「生成分析」，AI 将从五个维度拆解这篇文章。</p>
        </div>
      </section>
    </article>
  </template>

  <template id="tpl-archive">
    <div class="archive">
      <header class="archive-head">
        <h1>全部文章</h1>
        <p class="archive-count" data-field="count"></p>
      </header>
      <div class="archive-controls">
        <input type="search" id="search-input" placeholder="搜索标题、作者、摘要..." />
        <div class="filter-chips" data-field="chips"></div>
      </div>
      <div class="article-list" data-field="list"></div>
    </div>
  </template>

  <template id="tpl-settings">
    <div class="settings">
      <header class="settings-head">
        <h1>设置</h1>
        <p>配置 LLM API，让 AI 为你生成文章系统性分析。</p>
      </header>
      <form class="settings-form" id="settings-form">
        <label>
          <span>API Key</span>
          <input type="password" id="api-key" placeholder="sk-ant-..." required />
        </label>
        <label>
          <span>Base URL</span>
          <input type="url" id="base-url" placeholder="https://api.anthropic.com" />
        </label>
        <label>
          <span>Model</span>
          <input type="text" id="model" placeholder="claude-sonnet-4-20250514" />
        </label>
        <button type="submit" class="btn btn-primary">保存</button>
        <p class="form-status" id="form-status"></p>
      </form>
    </div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
